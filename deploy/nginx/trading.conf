# Ubuntu VPS (bare metal) site config. Obtain certificates with certbot first.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name trading.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name trading.example.com;
    root /var/www/trading/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/trading.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 8m;

    location = /login     { limit_req zone=auth burst=5 nodelay; try_files $uri /index.php?$query_string; }
    location /api/v1/auth { limit_req zone=auth burst=5 nodelay; try_files $uri /index.php?$query_string; }
    location /api/        { limit_req zone=api burst=40 nodelay; try_files $uri /index.php?$query_string; }
    location /            { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
