; /etc/supervisor/conf.d/trading.conf
[program:trading-horizon]
command=php /var/www/trading/current/artisan horizon
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/trading/horizon.log

[program:trading-scheduler]
command=php /var/www/trading/current/artisan schedule:work
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/trading/scheduler.log

[program:execution-bridge]
command=node /var/www/trading/current/services/execution-bridge/server.js
environment=BRIDGE_TOKEN="change-me",PORT="8081",HOST="127.0.0.1"
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/trading/bridge.log
