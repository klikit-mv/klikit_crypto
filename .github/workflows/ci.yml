name: CI

on:
  push:
  pull_request:

jobs:
  laravel:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: trading_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_mysql, pdo_sqlite, redis, zip, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Test suite (SQLite)
        run: php artisan test
      - name: Migrations and seed on MySQL 8
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: trading_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate --force --seed
          php artisan migrate:rollback --force
          php artisan migrate --force

  execution-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/execution-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  mt5-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mt5-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest test_bridge.py
